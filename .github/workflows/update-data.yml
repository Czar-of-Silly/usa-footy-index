name: Update MLS Data
on:
  schedule:
    # Mornings after MLS match days (UTC). 0,3,4,6 = Sun, Wed, Thu, Sat.
    # MLS plays mostly Sat + Wed; this catches the morning after each.
    - cron: '0 11 * * 0,3,4,6'
  workflow_dispatch:   # manual "Run workflow" button for playoffs / makeups / off-schedule games
permissions:
  contents: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      # Layer 1: MLS official rosters (who's on each team, incl. SEI players)
      - name: Fetch MLS rosters (Layer 1)
        run: node fetch-mls-rosters.js
        timeout-minutes: 10

      # Layer 2a: official MLS (Opta) player stats -> public/data/stats-cache.json.
      # Free, no auth, works from GitHub's datacenter IP. This REPLACED Sofascore;
      # it feeds xG, chances, aerials, clearances, pressures and the GK
      # save-quality data into the grades. Must run BEFORE fetch-data.js, which
      # joins it by sportecId.
      - name: Fetch MLS official stats (Layer 2a)
        run: node fetch-mls-stats.js
        timeout-minutes: 10

      # Layer 2b: merge ESPN (boxscores) + ASA (xG/G+/xPass/dribbling) + the MLS
      # Opta stats above into the player cache. No proxy, no Sofascore. The
      # quality gate blocks the commit if MLS Opta coverage is missing
      # (fresh-or-nothing, never stale).
      - name: Build player cache (Layer 2b)
        run: node fetch-data.js
        timeout-minutes: 20

      # Layer 3: MLSPA salaries (salary-only; DP/U22/Intl come from Layer 1)
      - name: Fetch salaries
        run: node fetch-salary-data.js
        timeout-minutes: 10

      - name: Merge salaries into cache
        run: node merge-salary-and-dp.js
        timeout-minutes: 5

      # Season-tagged copy for the historical loader (2026 == current season).
      - name: Tag current-season copy
        run: cp public/data/mls-cache.json public/data/mls-cache-2026.json

      # Fail closed: a broken cache never gets committed or deployed.
      - name: Validate cache
        run: node validate-cache.js

      - name: Fetch market values (Transfermarkt dataset, weekly refresh)
        id: mv
        continue-on-error: true
        run: node fetch-market-values.js

      # Front-page articles: Claude drafts quick hits from the fresh cache.
      # Skips silently when the ANTHROPIC_API_KEY secret is missing; never
      # blocks the data update on an API hiccup.
      # Ask USFI knowledge: extract the live grading engine, compute grades,
      # and distill a compact context file for the /api/ask chatbot.
      - name: Build Ask USFI context
        id: askctx
        continue-on-error: true
        run: node build-ask-context.js
        timeout-minutes: 3
      - name: Generate front-page articles
        id: articles
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node generate-articles.js
        timeout-minutes: 5

      # Real ranking history for week-over-week movement (no simulated arrows).
      - name: Snapshot rankings
        run: node snapshot-rankings.js

      # Route metadata for /players/<slug> and /teams/<slug> previews + sitemap.
      - name: Build routes and sitemap
        run: node build-routes.js

      # Phase 5.3: the browser bundle is compiled here, not in the visitor's browser.
      - name: Build front-end bundle
        run: node build.js

      # Surface step health on the site masthead + Actions summary.
      - name: Write pipeline status
        if: always()
        env:
          MV_OUTCOME: ${{ steps.mv.outcome }}
          ASKCTX_OUTCOME: ${{ steps.askctx.outcome }}
          ARTICLES_OUTCOME: ${{ steps.articles.outcome }}
        run: node write-pipeline-status.js

      # Race-safe commit: rebase on top of anything pushed during the run,
      # then push. Skips cleanly when the data didn't change.
      - name: Commit and push (rebase-safe)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'public/data/*.json'
          git add public/sitemap.xml 2>/dev/null || true
          git add public/app.js public/index.html 2>/dev/null || true
          git add public/headshots/*.png 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes this run."
            exit 0
          fi
          git commit -m "Auto-update MLS data (rosters + Opta stats + salaries)"
          git checkout -- package.json package-lock.json 2>/dev/null || true
          git pull --rebase origin main
          git push origin main
