const FONTS = {fell:"'IM Fell English SC','Playfair Display',serif",sansOld:"'Inter',system-ui,sans-serif",serif:"'Source Serif 4','Libre Baskerville',Georgia,serif",sans:"'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif",mono:"'JetBrains Mono','Courier New',monospace",display:"'Playfair Display','Source Serif 4',Georgia,serif"};
const LIGHT = {bg:"#E1CDAC",surface:"#EBDFC4",card:"#E7D8B9",border:"#A3814B",borderLt:"#C8B68C",text:"#2E2922",textDim:"#5C5240",textMute:"#8B7B58",ink:"#231F19",accent:"#93433C",green:"#3F5232",red:"#93433C",blue:"#2C3944",gold:"#9C7B33",hoverRow:"#D8C7A1",...FONTS};

// Grade engine
function pct(a,v){const s=[...a].sort((x,y)=>x-y);return s.filter(x=>x<v).length/Math.max(s.length,1);}
function normPos(x){const t=String(x||"").toLowerCase().trim();/*POSNORM*/
  if(t==="gk"||t==="g"||t.includes("goal")||t.includes("keep"))return"Goalkeeper";
  if(t==="df"||t==="d"||t==="def"||t.includes("defen")||t.includes("back"))return"Defender";

function toG(p){return Math.round(42+Math.max(0,Math.min(1,p))*57);}
function computeGrades(ps){
  if(!ps.length)return{};
  const v=(k)=>ps.map(p=>p[k]||0);
  const xg=v("xg90"),xa=v("xa90"),ga=v("tga"),df=v("dga"),pc=v("pc"),pg=v("pga");

  const drb=v("drb90"),prgc=v("prgc90");

  const gkCs=gks.map(p=>p.csRate||0);

  const gkPc=gks.map(p=>p.pc||0);
  const gkPrs=gks.map(p=>p.prs90||0);
  const gkArl=gks.map(p=>p.arl90||0);
  const gkPrgp=gks.map(p=>p.prgp90||0);

  const gkPassesPctPool=gksWithMls.map(p=>p.passesPctMls||0);

  const ofXg=mk(ofs,"xg90"),ofXa=mk(ofs,"xa90"),ofGa=mk(ofs,"tga"),ofDf=mk(ofs,"dga"),ofPc=mk(ofs,"pc"),ofPg=mk(ofs,"pga"),ofKp=mk(ofs,"kp90"),ofSca=mk(ofs,"sca90"),ofFtp=mk(ofs,"ftp90"),ofPrs=mk(ofs,"prs90"),ofIntc=mk(ofs,"intc90"),ofArl=mk(ofs,"arl90"),ofDrb=mk(ofs,"drb90"),ofPrgc=mk(ofs,"prgc90"),ofOxg=mk(ofs,"oxg90"),ofChc=mk(ofs,"chc90"),ofGdr=mk(ofs,"gdrV"),ofEsc=mk(ofs,"escV"),ofPresR=mk(ofs,"presRV"),ofPassPerf=mk(ofs,"passPerfV"),ofClr=mk(ofs,"clr90"),ofFls=mk(ofs,"flSuf90"),ofArlPct=mk(ofs,"arlPctV"),ofTk=mk(ofs,"tk90"),ofTkPct=mk(ofs,"tkwPct"),ofBlk=mk(ofs,"blk90");

  // Single outfield composite collector (sub-grades ranked league-wide pass 2;
  // overall ranked within position pass 2)
  const __mn=new Map();const mn=(a)=>{if(!__mn.has(a))__mn.set(a,a.length?a.reduce((t,x)=>t+x,0)/a.length:0);return __mn.get(a);};const K90S=8;

  const gkComposites=[];

  const o={};

    if(p.isGK&&gks.length>=3){
      // ── GK GRADING ──
      // Shot-Stopping (mapped to "attack"): saves/90 60%, clean sheet rate 40%
      const hasGkEff=(p.gkEff90||0)!==0&&gksWithMls.length>=3;
      const n90sG=p.n90s||6.7;const Sg=(pool,val)=>pct(pool,((val||0)*n90sG+mn(pool)*K90S)/(n90sG+K90S));/*GKREGRESS*/

        ?Sg(gkEffPool,p.gkEff90)*.50+Sg(gkSvMlsPool,p.svMls90)*.30+Sg(gkCs,p.csRate)*.20
        :Sg(gkSv,p.sv90)*.60+Sg(gkCs,p.csRate)*.40;

        ?Sg(gkPassPerfPool,p.passPerf90)*.50+Sg(gkPassesPctPool,p.passesPctMls)*.25+Sg(gkDpasPctPool,p.dpasPct)*.25

      const car=wsum([[ofGdr,p.gdrV,.35],[ofEsc,p.escV,.20],[ofPrgc,p.prgc90,.15],[ofDrb,p.drb90,.10],[ofFtp,p.ftp90,.10],[ofFls,p.flSuf90,.10]]);
      const gaP=S(ofGa,p.tga);

      // Position-weighted Overall (weights unchanged)
      let ov;

        ov=att*.30+cre*.20+gaP*.25+car*.10+pas*.10+def*.05;

    }

  // ── GK PASS 2: rank-rescale ──
  // Convert each GK's composite + sub-grades to rank within GK pool, then

function AskDesk(){

    <div style={{display:"flex",gap:8}}>
      <input value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")ask();}} maxLength={300} placeholder="Ask about any player, club, or race..." style={{flex:1,padding:"12px 14px",fontFamily:T.serif,fontSize:15,color:T.ink,background:T.surface,border:"1px solid "+T.border,borderRadius:0,outline:"none"}}/>
      <button onClick={()=>ask()} disabled={busy} style={{padding:"12px 22px",fontFamily:T.mono,fontSize:12,fontWeight:700,letterSpacing:2,color:T.bg,background:T.ink,border:"none",borderRadius:0,cursor:busy?"default":"pointer",opacity:busy?.6:1}}>ASK</button>
    </div>

}

function tmSuggestReturns(o){/*TRADE-SUGGEST*/

}

// Season-over-season sparkline — shows grade dots connected by a line

// Mini inline sparkline for table rows — pure SVG, no Recharts
// ─── MATCH FORM (Phase 4a) ────────────────────────────────────────────
// Production-based per-match rating from the match-log row. Attackers/midfielders:
// goals, assists, shots, discipline, minutes (unchanged from the original formula).
// Defenders and keepers additionally: clean sheet / goals conceded while on the pitch.
// It is a proxy built from box-score events, not the full grading engine — say so in the UI.
function matchRating(m,pos){
  const P=String(pos||"").toLowerCase();
  const isGK=/gk|goal|keep/.test(P);
  const isDef=isGK||/def|back/.test(P);
  let r=55;
  r+=(m.g||0)*(isDef?14:12);r+=(m.a||0)*(isDef?10:8);
  r+=(m.sot||0)*2;r+=(m.sh||0)*.5;
  r-=(m.fl||0)*1;r-=(m.yc||0)*3;r-=(m.rc||0)*10;
  const mins=m.mins||0;r+=mins>=80?3:1;
  if(isDef&&mins>=60){const conceded=m.ha==="H"?(m.as||0):(m.hs||0);r+=conceded===0?8:conceded===1?2:conceded===2?-1:-3;if(isGK&&conceded===0)r+=2;}
  return Math.max(42,Math.min(99,Math.round(r)));
}
function computeForm(matchLog,pos){
  const log=Array.isArray(matchLog)?matchLog:[];
  if(!log.length)return null;
  const ratings=log.map(m=>matchRating(m,pos));
  const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:null;
  const last5=ratings.slice(-5),prev5=ratings.slice(-10,-5);
  const last5Avg=avg(last5),seasonAvg=avg(ratings);
  const basis=prev5.length>=3?"prev":"season";
  const delta=last5Avg==null?null:(basis==="prev"?last5Avg-avg(prev5):last5Avg-seasonAvg);
  const l5=log.slice(-5);
  const res=l5.map(m=>{const gf=m.ha==="H"?(m.hs||0):(m.as||0),ga=m.ha==="H"?(m.as||0):(m.hs||0);return gf>ga?"W":gf===ga?"D":"L";});
  return{ratings,last5Avg,seasonAvg,delta,basis,g:l5.reduce((s,m)=>s+(m.g||0),0),a:l5.reduce((s,m)=>s+(m.a||0),0),mins:l5.reduce((s,m)=>s+(m.mins||0),0),w:res.filter(x=>x==="W").length,d:res.filter(x=>x==="D").length,l:res.filter(x=>x==="L").length,res,count:log.length};
}
// Trend of the last 10 match ratings; the last five are shaded as the "form window".
function FormTrend({matchLog,pos,height=150}){
  const f=computeForm(matchLog,pos);
  if(!f||f.ratings.length<2)return null;
  const narrow=typeof window!=="undefined"&&window.innerWidth<600;
  const W=narrow?360:640,H=height,padL=30,padR=14,padT=24,padB=28,show=narrow?6:10;
  const pts0=matchLog.slice(-show),rs=f.ratings.slice(-show);
  const n=rs.length,x=i=>padL+(n===1?0:i*((W-padL-padR)/(n-1))),y=v=>padT+(1-(v-42)/57)*(H-padT-padB);
  const pts=rs.map((v,i)=>[x(i),y(v)]);
  const d="M"+pts.map(p=>p.map(v=>v.toFixed(1)).join(",")).join("L");
  const winStart=Math.max(0,n-5);
  return <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H} preserveAspectRatio="xMidYMid meet" role="img" aria-label={"Match rating trend, last "+n+" games"} style={{display:"block",fontFamily:T.sans}}>
    {n>5&&<rect x={x(winStart)-8} y={padT-6} width={x(n-1)-x(winStart)+16} height={H-padT-padB+12} fill={T.ink} opacity=".05"/>}
    {[50,60,70,80,90].map(v=><g key={v}><line x1={padL} x2={W-padR} y1={y(v)} y2={y(v)} stroke={T.borderLt} strokeWidth="1"/><text x={padL-6} y={y(v)+3} fontSize="10.5" fill={T.textMute} textAnchor="end" fontFamily="JetBrains Mono,monospace">{v}</text></g>)}
    {f.seasonAvg!=null&&<line x1={padL} x2={W-padR} y1={y(f.seasonAvg)} y2={y(f.seasonAvg)} stroke={T.textDim} strokeWidth="1" strokeDasharray="3 4"/>}
    <path d={d} fill="none" stroke={T.ink} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/>
    {pts.map(([px,py],i)=><g key={i}><circle cx={px} cy={py} r={i===n-1?5:3.5} fill={gc(rs[i])} stroke={T.bg} strokeWidth="1.5"/><text x={px} y={py-9} fontSize="10.5" fontWeight="700" fill={T.ink} textAnchor="middle" fontFamily="JetBrains Mono,monospace">{rs[i]}</text><text x={px} y={H-padB+13} fontSize="10" fill={T.textDim} textAnchor="middle">{(pts0[i].ha==="A"?"@":"")+(pts0[i].opp||"")}</text></g>)}
    {n>5&&<text x={x(winStart)-4} y={H-4} fontSize="9.5" fill={T.textMute} letterSpacing="1">LAST 5</text>}
    {f.seasonAvg!=null&&<text x={padL+2} y={y(f.seasonAvg)+10} fontSize="9.5" fill={T.textDim} textAnchor="start" letterSpacing=".5">SEASON AVG {Math.round(f.seasonAvg)}</text>}
  </svg>;
}

// 1) PLAYER — wide
async function cardPlayer(p){

    const b=cardFrame(x,{kicker:"Player Grade \u00b7 "+(p.position||""),title:p.name,sub:(p.teamName||p.team)+(p.age?" \u00b7 Age "+Math.floor(+p.age):"")+" \u00b7 "+(p.mins||0)+" minutes"});

    const ly=hy+hs+38;x.fillStyle=T.ink;x.fillRect(48,ly-22,CARD_W-96,1);

    let cx=48;stats.forEach(([l,v])=>{x.fillStyle=T.ink;x.font="900 30px "+F_DISPLAY;x.fillText(String(dv(v)),cx,ly+18);const w=x.measureText(String(dv(v))).width;x.fillStyle=T.textMute;x.font="700 10px "+F_MONO;cardSpaced(x,l,cx+w+8,ly+18,1.2);cx+=w+8+x.measureText(l).width*1.3+44;});
    // form
    if(p.matchLog&&p.matchLog.length>=2){const f=computeForm(p.matchLog,p.position);const rs=f.ratings.slice(-8);const fx=760,fy=ly-8,bw=34,bh=56;x.fillStyle=T.textMute;x.font="700 10px "+F_MONO;cardSpaced(x,"MATCH FORM \u00b7 LAST "+rs.length,fx,fy-20,1.4);x.fillStyle=T.textDim;x.font="400 10px "+F_MONO;x.textAlign="right";x.fillText("last 5 avg "+Math.round(f.last5Avg)+" \u00b7 season "+Math.round(f.seasonAvg),CARD_W-48,fy-20);x.textAlign="left";rs.forEach((v,i)=>{const h=Math.max(6,((v-42)/57)*bh);const bx=fx+i*(bw+8);x.fillStyle=gc(v);x.fillRect(bx,fy+bh-h,bw,h);x.fillStyle=T.ink;x.font="700 11px "+F_MONO;x.textAlign="center";x.fillText(v,bx+bw/2,fy+bh-h-5);x.fillStyle=T.textMute;x.font="400 9px "+F_MONO;x.fillText((p.matchLog.slice(-8)[i].opp||""),bx+bw/2,fy+bh+13);});x.textAlign="left";}

    const when=fmtETTime(m.date);

      const tx=align==="left"?px+150:px+40;x.fillStyle=T.ink;x.font="700 26px "+F_DISPLAY;x.fillText(cardTrunc(x,t.name,330),tx,b.y+38);

      if(t.overall!=null)cardStamp(x,tx+300,b.y+80,t.overall,"TEAM GRADE",92);};
    side(H,hl,48,"left");side(A,al,48+CARD_W/2-48,"left");
    x.fillStyle=T.ink;x.font="900 40px "+F_DISPLAY;x.textAlign="center";x.fillText("v",CARD_W/2,b.y+80);x.textAlign="left";

  });

// ─── MATCHUP PREVIEW (Phase 4c) ───────────────────────────────────────
const posGroupOf=(p)=>{const P=String(p&&p.position||"").toLowerCase();return /gk|goal|keep/.test(P)?"GK":/def|back/.test(P)?"DEF":/mid/.test(P)?"MID":"FWD";};
function MatchupView({home,away,teams,standings,matches,players,logos,onPlayer,onTeam,onCard,isMobile}){
  const tf=(ab)=>teams.find(t=>t.abbr===ab)||MLS_TEAMS.find(t=>t.abbr===ab)&&{...MLS_TEAMS.find(t=>t.abbr===ab),overall:null};
  const st={};standings.forEach(s=>{st[s.team]=s;});
  const pair=(m)=>(m.home===home&&m.away===away)||(m.home===away&&m.away===home);
  const fixture=matches.filter(m=>!m.completed&&pair(m)&&m.date).sort((a,b)=>a.date.localeCompare(b.date))[0]||null;
  // the fixture's own venue wins over the URL order
  const hAb=fixture?fixture.home:home,aAb=fixture?fixture.away:away;
  const H=tf(hAb),A=tf(aAb);
  if(!H||!A)return <div style={{padding:40,textAlign:"center",fontFamily:T.serif,fontStyle:"italic",color:T.textDim}}>That matchup isn't in the record.</div>;
  const ptsOrder=[...standings].sort((a,b)=>(b.pts||0)-(a.pts||0)||((b.gf||0)-(b.ga||0))-((a.gf||0)-(a.ga||0))||(b.gf||0)-(a.gf||0)).map(s=>s.team);
  const rank=(ab)=>{const i=ptsOrder.indexOf(ab);return i<0?null:i+1;};
  const played=(ab)=>{const s=st[ab]||{};return (s.w||0)+(s.d||0)+(s.l||0);};
  const ppg=(ab)=>{const g=played(ab);return g?((st[ab]||{}).pts||0)/g:null;};
  const lastN=(ab,n)=>matches.filter(m=>m.completed&&(m.home===ab||m.away===ab)&&m.date).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,n).reverse();
  const resOf=(m,ab)=>{const gf=m.home===ab?+(m.homeScore||0):+(m.awayScore||0),ga=m.home===ab?+(m.awayScore||0):+(m.homeScore||0);return gf>ga?"W":gf===ga?"D":"L";};
  const form=(ab)=>{const r=lastN(ab,5).map(m=>resOf(m,ab));return{res:r,pts:r.reduce((s,x)=>s+(x==="W"?3:x==="D"?1:0),0),n:r.length};};
  const fH=form(hAb),fA=form(aAb);
  const h2h=matches.filter(m=>m.completed&&pair(m)&&m.date).sort((a,b)=>b.date.localeCompare(a.date));
  const roster=(ab)=>players.filter(p=>p.team===ab&&!p.departed&&p.rated!==false&&p.overall!=null).sort((a,b)=>b.overall-a.overall);
  const rH=roster(hAb),rA=roster(aAb);
  const best=(r,g)=>r.find(p=>posGroupOf(p)===g)||null;
  const battles=[
    {label:"Home attack v away defense",a:best(rH,"FWD"),b:best(rA,"DEF")},
    {label:"Away attack v home defense",a:best(rA,"FWD"),b:best(rH,"DEF")},
    {label:"Midfield",a:best(rH,"MID"),b:best(rA,"MID")},
    {label:"Keepers",a:best(rH,"GK"),b:best(rA,"GK")},
  ].filter(x=>x.a&&x.b);
  // projection (labelled as such): grade gap + points-per-game gap + home advantage
  const gd=(H.overall!=null&&A.overall!=null)?H.overall-A.overall:null;
  const pg=(ppg(hAb)!=null&&ppg(aAb)!=null)?ppg(hAb)-ppg(aAb):null;
  let proj=null;
  if(gd!=null||pg!=null){const z=0.05*(gd||0)+0.8*(pg||0)+0.30;const pHomeWin=1/(1+Math.exp(-z));const draw=0.26;proj={home:Math.round(pHomeWin*(1-draw)*100),draw:Math.round(draw*100),away:0};proj.away=100-proj.home-proj.draw;}
  const stamp=(g)=>g==null?<span style={{fontFamily:T.serif,fontWeight:700,color:T.textMute}}>NR</span>:<span style={{display:"inline-flex",flexDirection:"column",alignItems:"center",border:`2px solid ${gc(g)}`,padding:"8px 14px 6px",transform:"rotate(-3deg)"}}><span style={{fontFamily:T.display,fontWeight:900,fontSize:36,lineHeight:1,color:gc(g)}}>{Math.round(g)}</span><span style={{fontFamily:T.mono,fontSize:10,letterSpacing:1.2,color:gc(g),marginTop:3}}>TEAM GRADE</span></span>;
  const pills=(res)=><div style={{display:"flex",gap:4}}>{res.length?res.map((r,i)=><span key={i} aria-label={r==="W"?"win":r==="D"?"draw":"loss"} style={{display:"inline-flex",alignItems:"center",justifyContent:"center",width:22,height:22,fontFamily:T.mono,fontWeight:700,fontSize:12,color:T.bg,background:r==="W"?T.green:r==="D"?T.textDim:T.red}}>{r}</span>):<span style={{fontFamily:T.serif,fontStyle:"italic",fontSize:12,color:T.textMute}}>No results on record</span>}</div>;
  const club=(t,ab,f,align)=>{const s=st[ab]||{};const rk=rank(ab);return <div style={{display:"flex",flexDirection:"column",alignItems:align==="right"&&!isMobile?"flex-end":"flex-start",gap:8,minWidth:0}}>
    <div onClick={()=>onTeam&&onTeam(ab)} style={{display:"flex",alignItems:"center",gap:12,cursor:"pointer",flexDirection:align==="right"&&!isMobile?"row-reverse":"row"}}><TeamBadge abbr={ab} size={64} logo={logos[ab]}/><div style={{minWidth:0,textAlign:align==="right"&&!isMobile?"right":"left"}}><div style={{fontFamily:T.display,fontWeight:700,fontSize:isMobile?20:26,color:T.ink,lineHeight:1.1}}>{t.name}</div><div style={{fontFamily:T.mono,fontSize:12,color:T.textDim,marginTop:4}}>{t.conf||s.conf||""}{rk?` \u00b7 #${rk} on points`:""}</div><div style={{fontFamily:T.mono,fontSize:12,color:T.textDim}}>{s.w!=null?`${s.w}-${s.d}-${s.l} \u00b7 ${s.pts} pts`:"\u2014"}</div></div></div>
    <div style={{display:"flex",alignItems:"center",gap:14,flexDirection:align==="right"&&!isMobile?"row-reverse":"row"}}>{stamp(t.overall)}<div><div style={{fontFamily:T.mono,fontSize:11,letterSpacing:1.2,color:T.textMute,marginBottom:4}}>{f.n?`LAST ${f.n}`:"FORM"}</div>{pills(f.res)}</div></div>
  </div>;};
  const bar=(label,vh,va,fmt,note)=>{const ok=vh!=null&&va!=null;const tot=ok?Math.max(0.0001,Math.abs(vh)+Math.abs(va)):1;const ph=ok?Math.abs(vh)/tot:0.5;const lead=ok?(vh>va?"H":va>vh?"A":"=" ):null;return <div style={{display:"grid",gridTemplateColumns:isMobile?"1fr":"64px 1fr 64px",gap:isMobile?4:12,alignItems:"center",padding:"10px 0",borderBottom:`1px dotted ${T.borderLt}`}}>
    {!isMobile&&<div style={{fontFamily:T.display,fontWeight:700,fontSize:18,color:lead==="H"?T.ink:T.textDim,textAlign:"right"}}>{ok?fmt(vh):"\u2014"}</div>}
    <div><div style={{display:"flex",justifyContent:"space-between",fontFamily:T.mono,fontSize:11,letterSpacing:1.2,color:T.textMute,marginBottom:4}}><span>{isMobile&&ok?fmt(vh)+" \u00b7 ":""}{label}{isMobile&&ok?" \u00b7 "+fmt(va):""}</span>{note&&<span style={{letterSpacing:0,textTransform:"none"}}>{note}</span>}</div><div style={{display:"flex",height:8,background:T.borderLt}}><div style={{width:`${ph*100}%`,background:lead==="A"?T.textMute:T.ink}}/><div style={{flex:1,background:lead==="H"?T.textMute:T.accent}}/></div></div>
    {!isMobile&&<div style={{fontFamily:T.display,fontWeight:700,fontSize:18,color:lead==="A"?T.accent:T.textDim}}>{ok?fmt(va):"\u2014"}</div>}
  </div>;};

  const H=(t,id)=><h3 id={id} style={{fontFamily:T.display,fontWeight:700,fontSize:isMobile?22:26,color:T.ink,margin:"34px 0 10px",lineHeight:1.15,scrollMarginTop:80}}>{t}</h3>;
  const P=(c)=><p style={{fontFamily:T.serif,fontSize:15,lineHeight:1.65,color:T.text,margin:"0 0 12px"}}>{c}</p>;
  const K=(c)=><code style={{fontFamily:T.mono,fontSize:12.5,background:T.card,padding:"1px 5px",border:`1px solid ${T.borderLt}`}}>{c}</code>;
  const Row=(l,v,ok)=><div style={{display:"flex",justifyContent:"space-between",gap:12,padding:"7px 0",borderBottom:`1px dotted ${T.borderLt}`,fontFamily:T.mono,fontSize:12}}><span style={{color:T.textDim}}>{l}</span><span style={{color:ok===false?T.red:ok===true?T.green:T.ink,fontWeight:700,textAlign:"right"}}>{v}</span></div>;
  const W=(rows)=><div style={{overflowX:"auto"}}><table style={{borderCollapse:"collapse",width:"100%",fontFamily:T.mono,fontSize:12,margin:"6px 0 12px"}}><thead><tr>{["Position","Attack","Creativity","Goals Added","Carrying","Passing","Defense"].map(h=><th key={h} style={{textAlign:h==="Position"?"left":"right",padding:"6px 8px",borderBottom:`2px solid ${T.ink}`,fontWeight:700,fontSize:11.5,letterSpacing:1,color:T.textDim}}>{h.toUpperCase()}</th>)}</tr></thead><tbody>{rows.map(r=><tr key={r[0]}>{r.map((c,i)=><td key={i} style={{textAlign:i?"right":"left",padding:"6px 8px",borderBottom:`1px dotted ${T.borderLt}`,fontWeight:i?400:700,color:T.ink}}>{i?(c*100).toFixed(0)+"%":c}</td>)}</tr>)}</tbody></table></div>;
  const toc=[["status","Data status"],["grade","How a grade is built"],["weights","Position weights"],["gk","Goalkeepers"],["team","Team grade, table, power rank"],["form","Match ratings & form"],["articles","Articles"],["sources","Sources"],["schedule","Update schedule"],["limits","Limitations"]];
  return <div style={{maxWidth:820,margin:"0 auto"}}>
    <div style={{fontFamily:T.mono,fontSize:11.5,fontWeight:700,letterSpacing:"0.2em",textTransform:"uppercase",color:T.accent}}>Methodology {"·"} Data status</div>
    <h2 style={{fontFamily:T.display,fontWeight:700,fontSize:isMobile?30:40,color:T.ink,margin:"6px 0 8px",lineHeight:1.05,letterSpacing:-.5}}>How the Index works</h2>
    <p style={{fontFamily:T.serif,fontStyle:"italic",fontSize:16,color:T.textDim,margin:"0 0 18px"}}>What the numbers mean, where they come from, when they update, and where they fall short.</p>
    <nav aria-label="On this page" style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:6}}>{toc.map(([id,l])=><a key={id} href={"#"+id} onClick={e=>{e.preventDefault();const el=document.getElementById(id);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}} style={{fontFamily:T.mono,fontSize:11.5,letterSpacing:.5,color:T.ink,border:`1px solid ${T.border}`,padding:"4px 9px",textDecoration:"none",background:T.card}}>{l}</a>)}</nav>

    {H("Data status","status")}
    <div style={{border:`1px solid ${stale?T.red:T.border}`,background:T.surface,padding:isMobile?"12px 14px":"14px 18px"}}>
      {Row("Last successful update",gen?fmtETTime(gen)+(ageH!=null?` (${ageH<1?"under an hour":ageH+" h"} ago)`:""):"—",gen?!stale:false)}
      {Row("Players in the record",cacheMeta?String(cacheMeta.players):"—")}
      {Row("Players graded (minutes > 0)",String(graded))}
      {Row("Players with 5+ match logs",String(withLog))}
      {Row("Players with a market value",String(withMV))}
      {Row("Flagged departed",String(departed))}
      {Row("Clubs graded",String(teams.filter(t=>t.overall!=null).length)+" / 30")}
      {Row("Sources on last run",cacheMeta&&cacheMeta.sources&&cacheMeta.sources.length?cacheMeta.sources.join(" · "):"—",cacheMeta?cacheMeta.sources.length>=3:null)}
      {steps&&Object.entries(steps).map(([k,v])=>Row("Pipeline · "+k,v+(k==="articles"&&pipeStatus.articleReasonLabel?" — "+pipeStatus.articleReasonLabel:""),v==="ok"))}
      {Row("Ranking snapshots on file",snaps.length?`${snaps.length} (since ${fmtET(snaps[0].date)})`:"none yet")}
      {Row("Next scheduled refresh",nxt?fmtETTime(nxt):"—")}
    </div>
    {P(<>The masthead shows the same update time. If the record is more than four days old, or a source fails, a warning strip appears at the top of every page rather than presenting stale numbers as current.</>)}

    {H("How a grade is built","grade")}
    <GradeFlow isMobile={isMobile}/>
    {P(<><b>1. Rates, not totals.</b> Every counting stat is converted to a per-90 rate so a 1,200-minute player and a 2,400-minute player are judged on the same footing.</>)}
    {P(<><b>2. Shrinkage toward the league.</b> Small samples are pulled toward the league mean: {K("rate′ = (rate × n90 + mean × 8) / (n90 + 8)")}. A player with two games is mostly league-average until he proves otherwise; after twenty games the shrinkage barely registers. Anyone with zero minutes is treated as having 90.</>)}
    {P(<><b>3. Percentile ranks.</b> Each shrunk rate is ranked against every outfield player in the record (goalkeepers against goalkeepers), giving a percentile from 0 to 1. Sub-grades — Attack, Passing, Defense, Creativity, Carrying, and a Goals Added component — are weighted blends of those percentiles.</>)}
    {P(<><b>4. A position-weighted composite.</b> The sub-grades are combined with weights that depend on position (table below). The composite is then measured against a <i>position reference point</i> rather than re-ranked: each position's reference is set so a complete performer at that position lands near the ceiling, which is what lets a centre-back and a striker both reach the high 90s. Position reference points are {K("FW 0.85 · MF 0.82 · DF 0.72 · GK 0.72")}.</>)}
    {P(<><b>5. The 0–99 scale.</b> Sub-grades map with {K("grade = (blend ÷ 0.85)^0.9 × 99")} and Overall with {K("grade = (composite ÷ reference)^0.9 × 99")}, both capped at 99. The exponent below 1 lifts the middle of the scale slightly, so the league median lands in the low 70s rather than at 50. In practice this season's Overall grades run from the high 30s to 99 with a median of 72; only a handful of players who have played fall below 40. Grades are recomputed from scratch on every update, so they can move even when a player doesn't play — the pool moved.</>)}
    <div style={{display:"flex",gap:8,flexWrap:"wrap"}}><button onClick={onGrading} style={{background:"none",border:`1px solid ${T.border}`,padding:"6px 12px",cursor:"pointer",fontFamily:T.sans,fontWeight:600,fontSize:12,color:T.accent,borderRadius:0}}>Open the sub-grade definitions</button><button onClick={()=>onTab("players")} style={{background:"none",border:`1px solid ${T.border}`,padding:"6px 12px",cursor:"pointer",fontFamily:T.sans,fontWeight:600,fontSize:12,color:T.textDim,borderRadius:0}}>See the grades {"→"}</button></div>

    {H("Position weights","weights")}
    {W([["Forward",.30,.20,.25,.10,.10,.05],["Midfielder",.15,.20,.20,.10,.20,.15],["Defender",.05,.10,.25,.10,.20,.30]])}
    {P(<>Forwards are judged first on attacking output and creation; defenders on defensive actions and their Goals Added; midfielders on a balanced mix with passing and creativity carrying the most weight. Goals Added (from American Soccer Analysis) is the one component every position shares because it values actions by how much they change scoring probability, whoever performs them.</>)}

    {H("Goalkeepers","gk")}
    {P(<>Keepers live in their own pool. Shot-stopping uses Opta's goals-prevented efficiency and saves per 90 with clean-sheet rate; distribution uses passing performance, completion and difficult-pass share. The composite is ranked among keepers and mapped to the same 42–99 look with a slightly different curve so the best keeper can still reach 99.</>)}

    {H("Team grade, points table, power rank","team")}
    {P(<>These are three different questions and the site keeps them apart on purpose.</>)}
    {P(<><b>Team grade</b> is the minutes-weighted average of the roster's Overall grades (departed players excluded). It measures the <i>quality of the players who actually play</i> — it knows nothing about results.</>)}
    {P(<><b>The table</b> is the official standings: points, goal difference, goals for. It measures results, whoever produced them.</>)}
    {P(<><b>Power rank</b> blends the two with recent form: {K("50% points share + 30% team grade + 20% last-five form")}. It is the site's ranking of who is strongest <i>right now</i>.</>)}
    {P(<>They disagree often, and that is information: a club with the best grade and a mid-table record is underperforming its talent, or its best players are missing. The front page labels its lead as a <b>Team Grade Leader</b> for exactly this reason; the Power Rankings live on the Table tab. Movement arrows on the Table only show week-over-week change once a genuine prior snapshot exists ({snaps.length} on file); until then they compare against the points table and say so.</>)}

    {H("Match ratings & form","form")}
    {P(<>Player pages show a rating for each match. This is a <b>box-score production proxy</b>, not the Index grade: goals, assists, shots, discipline and minutes; defenders and keepers are also credited for clean sheets and debited for goals conceded while on the pitch. It exists to show direction — form panels, Risers &amp; Fallers, Team of the Week — and the same function feeds every one of those, so a player's form means the same thing everywhere. Match previews add a clearly labelled <i>projection</i> built from the grade gap, points per game and a fixed home-advantage term; it is boxed and marked as an estimate, and it is the only number on the site that is not a measurement.</>)}

    {H("Articles","articles")}
    {P(<>Front-page briefs are generated from a fact packet built out of the record — results, races, standings, verified roster moves — by a language model that is instructed to use only those facts and to search the web before naming any transfer destination. Every brief then passes a validator that checks each player name against the record and rejects speculation. Only approved briefs are shown; anything the validator holds back stays out of sight. A brief also expires: nothing older than seven days, or more than seven days behind the data it sits next to, is displayed. If generation fails, the pipeline status above says why.</>)}

    {H("Sources","sources")}
    {P(<><b>ESPN</b> — rosters, standings, schedule, box scores (goals, assists, shots, fouls, cards, saves), headshots and club logos. <b>American Soccer Analysis</b> — expected goals and assists, Goals Added, expected passing, salaries. <b>MLS Official (Opta)</b> — chances created, key passes, aerials, clearances, pressures, goalkeeper save quality and distribution. <b>MLS Players Association</b> — the salary guide. <b>Transfermarkt</b> — market values, refreshed weekly and carried forward from a cached file when the live source is unreachable.</>)}
    {P(<>The Index is independent and not affiliated with Major League Soccer, its clubs, or any data provider.</>)}

    {H("Update schedule","schedule")}
    {P(<>The record refreshes the morning after each MLS match day: <b>Sunday, Wednesday, Thursday and Saturday at 7:00 AM ET</b>. Each run re-fetches every source, validates the cache (bad dates, duplicates, missing fields, impossible tables and fixtures wrongly marked upcoming all block the publish), snapshots the rankings, regenerates player and match pages, rebuilds the sitemap and then attempts the briefs. A separate Tuesday job drafts the newsletter. Next refresh: <b>{nxt?fmtETTime(nxt):"—"}</b>.</>)}

    {H("Limitations","limits")}
    <ul style={{fontFamily:T.serif,fontSize:15,lineHeight:1.65,color:T.text,paddingLeft:22,margin:"0 0 12px"}}>
      <li>Grades are relative and the scale is 0–99. A 75 is a 75 against this season's pool, not an absolute standard, and the pool moves every update.</li>
      <li>Low-minute players are shrunk hard toward the mean; their grades are placeholders until they play.</li>
      <li>Match ratings are a proxy from box-score events. Off-ball work, positioning and errors that don't produce an event are invisible to them.</li>
      <li>Not every player has every source. Where a provider has no row for a player, that component falls back to the league mean rather than zero, and the player page shows a dash instead of a number.</li>
      <li>Market values cover most regular starters but not every squad player; ages come from roster feeds and may be approximate.</li>
      <li>Postponed and suspended fixtures stay on the schedule with their original date and are labelled as such.</li>
      <li>The projection on match previews does not use injuries, lineups, travel or odds.</li>
    </ul>
    <div style={{marginTop:24,padding:"12px 14px",border:`1px dashed ${T.border}`,fontFamily:T.serif,fontStyle:"italic",fontSize:13,color:T.textDim}}>Found a number that looks wrong? The fastest fix is a note with the player or club and the page it appears on — every figure here can be traced to a source row.</div>
  </div>;
}

function MatchupsView({matches,teams,logos,isMobile,onMatchup,onCard}){

  const upcoming=matches.filter(m=>!m.completed&&m.date&&Date.parse(m.date)>now-3*3600e3).sort((a,b)=>a.date.localeCompare(b.date));
  const recent=matches.filter(m=>m.completed&&m.date).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,20);
  const dayKey=(d)=>fmtET(d,{weekday:"long",month:"long",day:"numeric"});
  const groups=[];upcoming.forEach(m=>{const k=dayKey(m.date);const g=groups.find(x=>x.k===k);if(g)g.items.push(m);else groups.push({k,items:[m]});});

    {!isMobile&&<div style={{fontFamily:T.mono,fontSize:12,color:T.textDim}}>{isUp?fmtETTime(m.date).replace(/^[A-Za-z]+ \d+, /,""):fmtET(m.date)}{post?" \u00b7 "+m.status:""}</div>}
    {!isMobile&&<div style={{fontFamily:T.mono,fontSize:12,color:T.textDim}}>{H.overall!=null&&A.overall!=null?<span>grade <b style={{color:gc(H.overall)}}>{Math.round(H.overall)}</b> v <b style={{color:gc(A.overall)}}>{Math.round(A.overall)}</b></span>:""}</div>}
    <div style={{display:"flex",gap:6,alignItems:"center"}} onClick={e=>e.stopPropagation()}>{isUp&&<CardButton small label="Card" onClick={()=>onCard(m)}/>}<button onClick={()=>onMatchup(m.home,m.away)} style={{background:T.ink,border:"none",color:T.bg,padding:"6px 10px",cursor:"pointer",fontFamily:T.sans,fontWeight:600,fontSize:12,borderRadius:0,whiteSpace:"nowrap"}}>{isUp?"Preview":"Head-to-head"} {"\u2192"}</button></div>
  </div>;};
  const sect=(t,extra)=><div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",borderBottom:`2px solid ${T.ink}`,paddingBottom:6,marginBottom:6,marginTop:22}}><span style={{fontFamily:T.mono,fontSize:11,fontWeight:700,letterSpacing:"0.2em",textTransform:"uppercase",color:T.ink}}>{t}</span>{extra&&<span style={{fontFamily:T.serif,fontStyle:"italic",fontSize:12,color:T.textDim}}>{extra}</span>}</div>;
  return <div style={{maxWidth:980,margin:"0 auto"}}>
    <div style={{fontFamily:T.mono,fontSize:11,fontWeight:700,letterSpacing:"0.2em",textTransform:"uppercase",color:T.accent}}>Matchups</div>
    <h2 style={{fontFamily:T.display,fontWeight:700,fontSize:isMobile?28:36,color:T.ink,margin:"6px 0 6px",lineHeight:1.05}}>The fixture list, previewed</h2>
    <p style={{fontFamily:T.serif,fontStyle:"italic",fontSize:15,color:T.textDim,margin:"0 0 6px"}}>Every upcoming match with team grade, points, form and key battles. Kickoffs in Eastern Time.</p>
    {groups.length?groups.map(g=><div key={g.k}>{sect(g.k,g.items.length+(g.items.length===1?" match":" matches"))}{g.items.map(m=>row(m,true))}</div>):<div style={{fontFamily:T.serif,fontStyle:"italic",color:T.textDim,padding:"20px 0"}}>No upcoming fixtures on the schedule.</div>}
    {recent.length>0&&<div>{sect("Recent results","click for the head-to-head")}{recent.map(m=>row(m,false))}</div>}
  </div>;
}

function MiniSparkline({matchLog,pos,w=40,h=14}){
  if(!matchLog||matchLog.length<2)return null;
  const last5=matchLog.slice(-5);
  const rates=last5.map(m=>matchRating(m,pos));
  const mn=Math.min(...rates),mx=Math.max(...rates),rng=mx-mn||1;
  const pts=rates.map((v,i)=>[i*(w/(rates.length-1)),h-2-((v-mn)/rng)*(h-4)]);
  const d="M"+pts.map(p=>p.join(",")).join("L");
  const latest=rates[rates.length-1];
  const col=gc(latest);
  return <svg width={w} height={h} style={{display:"block",flexShrink:0}}><path d={d} fill="none" stroke={col} strokeWidth={1.5} strokeLinecap="round" strokeLinejoin="round"/><circle cx={pts[pts.length-1][0]} cy={pts[pts.length-1][1]} r={2} fill={col}/></svg>;
}

// Tiny inline SVG sparkline for table rows (no Recharts overhead)
function MiniSpark({data,width=60,height=20,color}){
  if(!data||data.length<2)return <span style={{fontFamily:T.mono,fontSize:11.5,color:T.textMute}}>—</span>;
  const vals=data.map(d=>d.grade);
  const innerW=width-6,innerH=height-6;
  const rawMn=Math.min(...vals),rawMx=Math.max(...vals);
  const mid=(rawMn+rawMx)/2,span=Math.max(rawMx-rawMn,14);
  const mn=mid-span/2-2,range=span+4;
  const X=i=>2+(i/(vals.length-1))*innerW;
  const Y=v=>3+innerH-((v-mn)/range)*innerH;
  const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
  const pts=vals.map((v,i)=>`${X(i)},${Y(v)}`).join(" ");
  return <svg width={width} height={height} style={{display:"block"}}>
    <line x1={2} y1={Y(avg)} x2={2+innerW} y2={Y(avg)} stroke={T.border} strokeWidth="1" strokeDasharray="2 3"/>
    <polyline points={pts} fill="none" stroke={T.ink} strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"/>
    <circle cx={X(vals.length-1)} cy={Y(vals[vals.length-1])} r="2.5" fill={color||T.ink}/>
  </svg>;
}

function PlayerModal({player:p,onClose,onCompare,isInCompare,pctRanks,history,formCurve,seasonInfo,similarPlayers,onSelectPlayer,dark:isDarkMode}){
  const[shareMsg,setShareMsg]=useState("");
  const[hsError,setHsError]=useState(false);
  useEffect(()=>setHsError(false),[p?.id]);
  if(!p)return null;
  const ae=Number(p.passAboveExp);
  const pct=pctRanks||{};
  const bar=(label,val,max,highlight,pctKey)=>(
    <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:8}}>

      <div style={{flex:1,height:5,background:T.borderLt,borderRadius:0,overflow:"hidden"}}>
        <div style={{width:`${val==null?0:Math.min(100,Math.max(1,(val/max)*100))}%`,height:"100%",background:highlight?T.ink:"#A09A9060",borderRadius:0,transition:"width .5s ease"}}/>

  return <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.4)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16,backdropFilter:"blur(4px)"}}>
    <div onClick={e=>e.stopPropagation()} className="resp-modal" style={{background:T.bg,border:`1px solid ${T.border}`,borderRadius:0,width:"100%",maxWidth:860,maxHeight:"92vh",width:"calc(100% - 16px)",overflowY:"auto",animation:"modalIn .3s ease",boxShadow:"0 24px 60px rgba(0,0,0,.2)",position:"relative"}}>

      {/* Detailed Stats — 3x2 grid */}
      {(p.position==="GK"||p.position==="Goalkeeper")?

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:`1px solid ${T.borderLt}`,paddingBottom:6,marginBottom:12}}>

          const srFiltered=ratings.filter(p=>{

            if(srTeamFilter!=="All"&&p.team!==srTeamFilter)return false;
            if((p.mins||0)<srMinMins)return false;
            return true;
          }).sort((a,b)=>{
            const dir=srDir==="asc"?1:-1;
            if(srSort==="age")return dir*(parseFloat(a.age||99)-parseFloat(b.age||99));
            if(srSort==="name")return dir*(a.name||"").localeCompare(b.name||"");
            return dir*((parseFloat(a[srSort])||0)-(parseFloat(b[srSort])||0));
          });

          const formIcon=(t)=>t==="up"?"▲":t==="down"?"▼":"—";
          const formColor=(t)=>t==="up"?T.green:t==="down"?T.red:T.textMute;
          const profileColor=(p)=>p==="Offensive"?T.accent:p==="Defensive"?T.blue:T.textDim;

          // Top 3 season rated
          const top3=srFiltered.slice(0,3);

          // Stats summary (based on filtered)
          const avgSR=srFiltered.length?Math.round(srFiltered.reduce((s,p)=>s+p.seasonGrade,0)/srFiltered.length):0;
          const eliteCount=srFiltered.filter(p=>p.seasonGrade>=85).length;
          const avgConsistency=srFiltered.length?Math.round(srFiltered.reduce((s,p)=>s+p.consistency,0)/srFiltered.length):0;

          return <div style={{animation:"fadeUp .4s ease"}}>
            {/* Header */}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginBottom:20,flexWrap:"wrap",gap:12}}>
              <div>
                <div style={{fontFamily:T.display,fontWeight:700,fontSize:26,color:T.ink,letterSpacing:-.5}}>Season Rating</div>
                <div style={{fontSize:12,color:T.textMute,fontFamily:T.sans,marginTop:4}}>Cumulative season performance — unlike Player Grades (a per-90 snapshot), this rewards durability, goal involvement, and Goals Added over a full season. · {srFiltered.length} players shown</div>
              </div>
              <div style={{display:"flex",gap:6}}>
                {["table","position","tiers"].map(v=><button key={v} onClick={()=>setSrView(v)} style={{background:srView===v?T.ink:"transparent",color:srView===v?T.bg:T.textDim,border:`1px solid ${srView===v?T.ink:T.border}`,borderRadius:0,padding:"5px 14px",cursor:"pointer",fontFamily:T.sans,fontWeight:600,fontSize:11.5,letterSpacing:.5,textTransform:"uppercase"}}>{v==="table"?"Table":v==="position"?"By Position":"Tiers"}</button>)}
              </div>
            </div>

            {/* Summary cards */}
            <div className="resp-grid4" style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:16}}>
              {[
                {v:srFiltered.length,l:"Players",sub:srMinMins>0?`${srMinMins}+ min`:"All minutes"},
                {v:avgSR,l:"Avg Rating",sub:gl(avgSR),c:gc(avgSR)},
                {v:eliteCount,l:"Elite Rated",sub:"85+ grade",c:T.gold},
                {v:`${avgConsistency}%`,l:"Avg Consistency",sub:"Cross-category",c:avgConsistency>=70?T.green:T.textDim},
              ].map(s=>(
                <div key={s.l} style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:0,padding:"10px 8px",textAlign:"center"}}>
                  <div style={{fontFamily:T.display,fontWeight:700,fontSize:20,color:s.c||T.ink,lineHeight:1}}>{s.v}</div>
                  <div style={{fontSize:10,color:T.textMute,fontWeight:600,letterSpacing:.5,marginTop:3,fontFamily:T.sans,textTransform:"uppercase"}}>{s.l}</div>
                </div>
              ))}
            </div>

            {/* What Changed — Biggest Movers */}
            {(()=>{
              const movers=filtered.filter(p=>{
                const pl=players.find(x=>x.id===p.id);
                return pl&&pl.matchLog&&pl.matchLog.length>=3;
              }).map(p=>{
                const pl=players.find(x=>x.id===p.id);
                const logs=pl.matchLog;
                const allRatings=logs.map(m=>matchRating(m,pl.position));
                const recent=allRatings.slice(-2);
                const prior=allRatings.slice(0,-2);
                if(prior.length<1)return null;
                const recentAvg=Math.round(recent.reduce((s,v)=>s+v,0)/recent.length);
                const priorAvg=Math.round(prior.reduce((s,v)=>s+v,0)/prior.length);
                const delta=recentAvg-priorAvg;
                // What context? Goals/assists in recent games
                const recentLogs=logs.slice(-2);
                const recentG=recentLogs.reduce((s,m)=>s+(m.g||0),0);
                const recentA=recentLogs.reduce((s,m)=>s+(m.a||0),0);
                let context="";
                if(recentG>0)context+=`${recentG}G `;
                if(recentA>0)context+=`${recentA}A `;
                if(!context&&delta>0)context="Strong all-around ";
                if(!context&&delta<0)context="Quiet stretch ";
                return{...p,...pl,delta,recentAvg,priorAvg,context:context.trim()};
              }).filter(Boolean);
              if(movers.length<6)return null;
              const risers=[...movers].filter(m=>m.delta>=3).sort((a,b)=>b.delta-a.delta).slice(0,3);
              const fallers=[...movers].filter(m=>m.delta<=-3).sort((a,b)=>a.delta-b.delta).slice(0,3);
              if(!risers.length&&!fallers.length)return null;
              return <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:0,padding:"16px 20px",marginBottom:20}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                  <div>
                    <div style={{fontFamily:T.display,fontWeight:700,fontSize:16,color:T.ink}}>What Changed</div>
                    <div style={{fontSize:11,color:T.textMute,fontFamily:T.sans}}>Biggest recent movers — last 2 games vs prior form</div>
                  </div>
                </div>
                <div className="resp-grid3" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
                  {risers.length>0&&<div>
                    <div style={{fontSize:10,color:T.green,fontWeight:700,letterSpacing:1.5,fontFamily:T.sans,marginBottom:8}}>↑ RISING</div>
                    {risers.map((p,i)=>(
                      <div key={p.id} onClick={()=>setSel(p)} className="rh" style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",borderRadius:0,cursor:"pointer",marginBottom:4}}>
                        <TeamBadge abbr={p.team} size={24} logo={p.teamLogo}/>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontFamily:T.serif,fontWeight:600,fontSize:12,color:T.ink}}>{p.name}</div>
                          <div style={{fontSize:10,color:T.textDim,fontFamily:T.sans}}>{p.context}</div>
                        </div>
                        <div style={{fontFamily:T.mono,fontWeight:700,fontSize:14,color:T.green}}>+{p.delta}</div>
                      </div>
                    ))}
                  </div>}
                  {fallers.length>0&&<div>
                    <div style={{fontSize:10,color:T.red,fontWeight:700,letterSpacing:1.5,fontFamily:T.sans,marginBottom:8}}>↓ FALLING</div>
                    {fallers.map((p,i)=>(
                      <div key={p.id} onClick={()=>setSel(p)} className="rh" style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",borderRadius:0,cursor:"pointer",marginBottom:4}}>
                        <TeamBadge abbr={p.team} size={24} logo={p.teamLogo}/>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontFamily:T.serif,fontWeight:600,fontSize:12,color:T.ink}}>{p.name}</div>
                          <div style={{fontSize:10,color:T.textDim,fontFamily:T.sans}}>{p.context}</div>
                        </div>
                        <div style={{fontFamily:T.mono,fontWeight:700,fontSize:14,color:T.red}}>{p.delta}</div>
                      </div>
                    ))}
                  </div>}
                </div>
              </div>;
            })()}

            {/* Top 3 Season Rated */}
            {srView==="table"&&top3.length>=3&&<div className="resp-grid3" style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:24}}>
              {top3.map((p,i)=>(
                <div key={p.id} onClick={()=>setSel(p)} style={{
                  background:T.surface,border:`1px solid ${i===0?T.gold+"40":T.border}`,borderRadius:0,padding:"18px 16px",
                  cursor:"pointer",transition:"box-shadow .2s",boxShadow:i===0?"0 2px 12px rgba(182,141,64,.15)":"none",
                  borderTop:i===0?`3px solid ${T.gold}`:i===1?`3px solid ${T.green}`:i===2?`3px solid ${T.blue}`:"none",
                }} onMouseEnter={e=>e.currentTarget.style.boxShadow="0 4px 16px rgba(0,0,0,.1)"} onMouseLeave={e=>e.currentTarget.style.boxShadow=i===0?"0 2px 12px rgba(182,141,64,.15)":"none"}>
                  <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
                    <span style={{fontFamily:T.display,fontWeight:900,fontSize:22,color:i===0?T.gold:i===1?T.green:T.blue}}>{i+1}</span>
                    <TeamBadge abbr={p.team} size={36} logo={p.teamLogo}/>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontFamily:T.serif,fontWeight:700,fontSize:16,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",color:T.ink}}>{p.name}</div>
                      <div style={{fontSize:11,color:T.textDim,fontFamily:T.sans}}>{p.position} · {p.team}</div>
                    </div>
                    <span style={{fontFamily:T.display,fontWeight:700,fontSize:30,color:gc(p.seasonGrade),lineHeight:1}}>{p.seasonGrade}</span>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:6}}>
                    <div style={{textAlign:"center",padding:"6px 4px",background:T.card,borderRadius:0}}>
                      <div style={{fontFamily:T.mono,fontSize:12,fontWeight:700,color:formColor(p.formTrend)}}>{formIcon(p.formTrend)}</div>
                      <div style={{fontSize:10,color:T.textMute,letterSpacing:.5,marginTop:2}}>FORM</div>
                    </div>
                    <div style={{textAlign:"center",padding:"6px 4px",background:T.card,borderRadius:0}}>
                      <div style={{fontFamily:T.mono,fontSize:12,fontWeight:700,color:T.ink}}>{p.consistency}%</div>
                      <div style={{fontSize:10,color:T.textMute,letterSpacing:.5,marginTop:2}}>CONSIST</div>
                    </div>
                    <div style={{textAlign:"center",padding:"6px 4px",background:T.card,borderRadius:0}}>
                      <div style={{fontFamily:T.mono,fontSize:12,fontWeight:700,color:T.ink}}>{p.impactPer90}</div>
                      <div style={{fontSize:10,color:T.textMute,letterSpacing:.5,marginTop:2}}>IMP/90</div>
                    </div>
                    <div style={{textAlign:"center",padding:"6px 4px",background:T.card,borderRadius:0}}>
                      <div style={{fontFamily:T.serif,fontSize:12,fontWeight:700,color:profileColor(p.profile)}}>{p.profile.slice(0,3).toUpperCase()}</div>
                      <div style={{fontSize:10,color:T.textMute,letterSpacing:.5,marginTop:2}}>TYPE</div>
                    </div>
                  </div>
                </div>
              ))}
            </div>}

            {/* Filters */}
            <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap",alignItems:"center"}}>
              <Select label="Position" value={srPosFilter} onChange={setSrPosFilter} width={130} options={["All","Forward","Midfielder","Defender","GK"]}/>
              <Select label="Team" value={srTeamFilter} onChange={setSrTeamFilter} width={200} options={teamOpts}/>
              <Select label="Min. Mins" value={String(srMinMins)} onChange={v=>setSrMinMins(Number(v))} width={110} options={[["0","All"],["200","200+"],["400","400+"],["600","600+"],["900","900+"],["1200","1200+"]]}/>
              <Select label="Sort" value={srSort} onChange={v=>{setSrSort(v);setSrDir(v==="age"?"asc":"desc");}} width={150} options={[["seasonGrade","Season Grade"],["consistency","Consistency"],["impactPer90","Impact/90"],["goals","Goals"],["assists","Assists"],["overall","Match Grade"],["age","Age"]]}/>
            </div>

            {/* ── TABLE VIEW ── */}
            {srView==="table"&&<TableWrap><div>
              {(()=>{const srTbl=isMobile?"28px 1fr 42px 32px 38px 38px 42px":"30px 1fr 56px 80px 50px 50px 60px 60px 64px";return <>
              {isMobile?<MobileSortBar options={[["seasonGrade","Season"],["goals","G"],["assists","A"],["consistency","Consistency"],["impactPer90","Impact/90"],["totalGA","G+"]]} sortKey={srSort} sortDir={srDir} onSort={toggleSrSort}/>:<div style={{display:"grid",gridTemplateColumns:srTbl,padding:"10px 14px",background:T.card,fontSize:12,color:T.textMute,fontWeight:600,letterSpacing:.8,borderBottom:`2px solid ${T.ink}`,fontFamily:T.sans,textTransform:"uppercase"}}>
                <div style={{textAlign:"center"}}>#</div><div>Player</div>
                <ColHead label="SZN" sortKey="seasonGrade" currentSort={srSort} currentDir={srDir} onSort={toggleSrSort} center/>
                <div style={{textAlign:"center"}}>{isMobile?"Form":"Form Curve"}</div>
                <ColHead label="G" sortKey="goals" currentSort={srSort} currentDir={srDir} onSort={toggleSrSort} center/>
                <ColHead label="A" sortKey="assists" currentSort={srSort} currentDir={srDir} onSort={toggleSrSort} center/>
                <ColHead label={isMobile?"Con":"Consist"} sortKey="consistency" currentSort={srSort} currentDir={srDir} onSort={toggleSrSort} center/>
                {!isMobile&&<ColHead label="Imp/90" sortKey="impactPer90" currentSort={srSort} currentDir={srDir} onSort={toggleSrSort} center/>}
                {!isMobile&&<ColHead label="G+" sortKey="totalGA" currentSort={srSort} currentDir={srDir} onSort={toggleSrSort} center/>}
              </div>}
              {srFiltered.map((p,i)=>isMobile?<MobileStatCard key={p.id} p={p} i={i} grade={p.seasonGrade} gradeLabel="Season" rankColor={i<3?T.gold:i<10?T.green:T.textMute} sub={`${p.position} \u00b7 ${p.team} \u00b7 ${p.mins} min${(p.mins||0)<450?" \u00b7 PROV":""}`} stats={[["G",p.goals],["A",p.assists],["Con",p.consistency],["Imp/90",p.impactPer90],["G+",(+p.totalGA>=0?"+":"")+p.totalGA,+p.totalGA>=0?T.green:T.red]]} onOpen={()=>setSel(p)}/>:<div key={p.id} onClick={()=>setSel(p)} className="rh" style={{display:"grid",gridTemplateColumns:srTbl,padding:isMobile?"8px 6px":"14px 14px",minHeight:isMobile?40:48,borderBottom:`1px solid ${T.borderLt}`,background:i%2===0?"transparent":T.surface,alignItems:"center",cursor:"pointer",animation:`fadeUp .25s ease both`,animationDelay:`${Math.min(i*12,250)}ms`}}>
                <div style={{fontFamily:T.serif,fontWeight:700,fontSize:isMobile?13:16,color:i<3?T.gold:i<10?T.green:T.textMute,textAlign:"center"}}>{i+1}</div>
                <div style={{display:"flex",alignItems:"center",gap:isMobile?6:12,marginLeft:isMobile?0:6,minWidth:0}}>
                  <TeamBadge abbr={p.team} size={isMobile?24:36} logo={p.teamLogo}/>
                  <div style={{minWidth:0}}>
                    <div style={{display:"flex",alignItems:"center",gap:5}}>
                      <span style={{fontFamily:T.serif,fontWeight:700,fontSize:isMobile?13:20,color:T.ink,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{shortName(p.name)}</span>
                      {!isMobile&&(p.mins||0)<450&&<span style={{fontSize:10,fontFamily:T.sans,fontWeight:700,color:T.textMute,background:`${T.textMute}15`,padding:"1px 5px",borderRadius:0,letterSpacing:.5,flexShrink:0}}>PROV</span>}
                    </div>
                    <div style={{fontSize:isMobile?11.5:14,color:T.textDim,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.position} · {p.team} · {p.mins} min</div>
                  </div>
                </div>
                <div style={{textAlign:"center"}}>
                  <div style={{display:"inline-flex",flexDirection:"column",alignItems:"center",background:gb(p.seasonGrade),border:`1.5px solid ${gc(p.seasonGrade)}30`,borderRadius:0,padding:isMobile?"2px 7px":"4px 10px",minWidth:isMobile?34:40}}>
                    <span style={{color:gc(p.seasonGrade),fontWeight:700,fontSize:isMobile?14:17,fontFamily:T.serif,letterSpacing:-.5,lineHeight:1}}>{p.seasonGrade}</span>
                  </div>
                </div>
                <div style={{textAlign:"center",fontFamily:T.mono,fontWeight:700,fontSize:isMobile?12:14,color:formColor(p.formTrend),display:"flex",alignItems:"center",justifyContent:"center"}}>
                  {isMobile?formIcon(p.formTrend):<span style={{display:"inline-flex",alignItems:"center",gap:6}}><MiniSpark data={genFormCurve(p)} width={68} height={22} color={gc(p.seasonGrade)}/><span style={{fontSize:12}}>{formIcon(p.formTrend)}</span></span>}
                </div>
                <div style={{fontFamily:T.serif,fontWeight:700,fontSize:isMobile?13:16,color:T.ink,background:hm(p.goals,20),borderRadius:0,textAlign:"center",padding:"2px 0"}}>{p.goals}</div>
                <div style={{fontFamily:T.serif,fontWeight:700,fontSize:isMobile?13:16,color:T.ink,background:hm(p.assists,15),borderRadius:0,textAlign:"center",padding:"2px 0"}}>{p.assists}</div>
                <div style={{textAlign:"center"}}>
                  <span style={{fontFamily:T.mono,fontWeight:600,fontSize:isMobile?12:12,color:p.consistency>=80?T.green:p.consistency>=60?T.blue:T.red,background:`${p.consistency>=80?T.green:p.consistency>=60?T.blue:T.red}10`,padding:"2px 6px",borderRadius:0}}>{p.consistency}%</span>
                </div>
                {!isMobile&&<div style={{fontSize:13,color:T.ink,fontWeight:600,fontFamily:T.mono,textAlign:"center"}}>{p.impactPer90}</div>}
                {!isMobile&&<div style={{fontSize:14,color:+p.totalGA>=0?T.green:T.red,fontWeight:700,fontFamily:T.mono,textAlign:"center"}}>{+p.totalGA>=0?"+":""}{p.totalGA}</div>}
              </div>)}
              </>})()}
            </div></TableWrap>}

            {/* ── POSITION VIEW ── */}
            {srView==="position"&&(()=>{
              // Build position groups from filtered data
              const filteredByPos={};srFiltered.forEach(p=>{if(!filteredByPos[p.posGroup])filteredByPos[p.posGroup]=[];filteredByPos[p.posGroup].push(p);});
              Object.values(filteredByPos).forEach(arr=>arr.sort((a,b)=>b.seasonGrade-a.seasonGrade));
              return <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(320px,1fr))",gap:16}}>
              {Object.entries(filteredByPos).sort(([a],[b])=>({FW:0,MF:1,DF:2,GK:3}[a]||4)-({FW:0,MF:1,DF:2,GK:3}[b]||4)).map(([pos,posPlayers])=>{
                const posLabel={FW:"Forwards",MF:"Midfielders",DF:"Defenders",GK:"Goalkeepers"}[pos]||pos;
                const posAvg=Math.round(posPlayers.reduce((s,p)=>s+p.seasonGrade,0)/posPlayers.length);
                return <div key={pos} style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:0,overflow:"hidden"}}>
                  <div style={{padding:"16px 18px",borderBottom:`1px solid ${T.borderLt}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div>
                      <div style={{fontFamily:T.display,fontWeight:700,fontSize:20,color:T.ink}}>{posLabel}</div>
                      <div style={{fontSize:11,color:T.textMute,fontFamily:T.sans}}>{posPlayers.length} players · Avg {posAvg}</div>
                    </div>
                    <Badge grade={posAvg} size="md"/>
                  </div>
                  {posPlayers.map((p,i)=>(
                    <div key={p.id} onClick={()=>setSel(p)} className="rh" style={{display:"flex",alignItems:"center",gap:10,padding:"10px 18px",borderBottom:`1px solid ${T.borderLt}`,cursor:"pointer"}}>
                      <div style={{fontFamily:T.display,fontWeight:900,fontSize:16,color:i<3?T.gold:i<10?T.green:T.textMute,width:22,textAlign:"center"}}>{i+1}</div>
                      <TeamBadge abbr={p.team} size={28} logo={p.teamLogo}/>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{display:"flex",alignItems:"center",gap:6}}>
                          <span style={{fontFamily:T.serif,fontWeight:600,fontSize:14,color:T.ink,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.name}</span>
                          {(p.mins||0)<450&&<span style={{fontSize:10,fontFamily:T.sans,fontWeight:700,color:T.textMute,background:`${T.textMute}15`,padding:"1px 5px",borderRadius:0,letterSpacing:.5,flexShrink:0}}>PROV</span>}
                        </div>
                        <div style={{fontSize:11,color:T.textDim,fontFamily:T.sans}}>{p.team} · {p.gamesPlayed} apps · {p.mins} min</div>
                      </div>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        <span style={{fontFamily:T.mono,fontWeight:700,fontSize:12,color:formColor(p.formTrend)}}>{formIcon(p.formTrend)}</span>
                        <span style={{fontFamily:T.mono,fontSize:11.5,color:p.consistency>=70?T.green:T.textDim}}>{p.consistency}%</span>
                        <div style={{display:"inline-flex",flexDirection:"column",alignItems:"center",background:gb(p.seasonGrade),border:`1.5px solid ${gc(p.seasonGrade)}30`,borderRadius:0,padding:"2px 8px",minWidth:36}}>
                          <span style={{color:gc(p.seasonGrade),fontWeight:700,fontSize:15,fontFamily:T.serif,lineHeight:1}}>{p.seasonGrade}</span>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>;
              })}
            </div>;})()}

            {/* ── TIERS VIEW ── */}
            {srView==="tiers"&&(()=>{
              const filteredTiers=[
                {label:"ELITE",min:85,color:T.gold,players:srFiltered.filter(p=>p.seasonGrade>=85)},
                {label:"GREAT",min:75,color:T.green,players:srFiltered.filter(p=>p.seasonGrade>=75&&p.seasonGrade<85)},
                {label:"ABOVE AVG",min:65,color:T.blue,players:srFiltered.filter(p=>p.seasonGrade>=65&&p.seasonGrade<75)},
                {label:"AVERAGE",min:55,color:T.textDim,players:srFiltered.filter(p=>p.seasonGrade>=55&&p.seasonGrade<65)},
                {label:"POOR",min:0,color:T.red,players:srFiltered.filter(p=>p.seasonGrade<55)},
              ];
              return <div>
              {/* Tier distribution bar */}
              <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:0,padding:"20px 24px",marginBottom:20}}>
                <div style={{fontSize:11.5,color:T.textMute,fontWeight:600,letterSpacing:1.5,fontFamily:T.sans,textTransform:"uppercase",marginBottom:14}}>Grade Distribution · {srFiltered.length} Players</div>
                <div style={{display:"flex",height:32,borderRadius:0,overflow:"hidden",marginBottom:12}}>
                  {filteredTiers.filter(t=>t.players.length>0).map(t=>(
                    <div key={t.label} style={{flex:t.players.length,background:t.color,opacity:.7,display:"flex",alignItems:"center",justifyContent:"center",minWidth:24,transition:"flex .4s ease"}}>
                      <span style={{fontSize:11.5,fontWeight:700,color:"#fff",textShadow:"0 1px 2px rgba(0,0,0,.3)",fontFamily:T.sans}}>{t.players.length}</span>
                    </div>
                  ))}
                </div>
                <div style={{display:"flex",gap:16,justifyContent:"center",flexWrap:"wrap"}}>
                  {filteredTiers.map(t=>(
                    <div key={t.label} style={{display:"flex",alignItems:"center",gap:5}}>
                      <div style={{width:10,height:10,borderRadius:0,background:t.color,opacity:.7}}/>

                {isOpen&&level===2&&<div style={{background:T.card,borderBottom:`2px solid ${T.border}`,padding:"12px 16px",animation:"fadeUp .2s ease"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>

                    <div style={{fontSize:11,color:T.accent,fontWeight:600,fontFamily:T.sans,cursor:"pointer"}} onClick={e=>{e.stopPropagation();setTeamLevel(1);}}>← Back to Stats</div>

                  :<div className="roster-scroll" style={{overflowX:isMobile?"auto":"visible",WebkitOverflowScrolling:"touch"}}><div style={{minWidth:isMobile?600:0}}>

          {/* Head-to-Head Preview */}
          <div style={{marginTop:24,background:T.surface,border:`1px solid ${T.border}`,borderRadius:0,padding:"20px 24px"}}>

            <div style={{display:"flex",gap:12,marginBottom:20,flexWrap:"wrap",alignItems:"center"}}>

            </div>
            {h2hHome&&h2hAway&&h2hHome!==h2hAway&&(()=>{
              const tH=enrichedTeams.find(t=>t.abbr===h2hHome);
              const tA=enrichedTeams.find(t=>t.abbr===h2hAway);
              if(!tH||!tA)return null;
              const cats=[{l:"Overall",k:"overall"},{l:"Attack",k:"attack"},{l:"Passing",k:"passing"},{l:"Defense",k:"defense"},{l:"Creativity",k:"creativity"},{l:"Carrying",k:"carrying"}];
              const hWins=cats.filter(c=>tH[c.k]>tA[c.k]).length;
              const aWins=cats.filter(c=>tA[c.k]>tH[c.k]).length;
              const hRoster=players.filter(p=>p.team===h2hHome&&!p.departed).sort((a,b)=>b.overall-a.overall);
              const aRoster=players.filter(p=>p.team===h2hAway&&!p.departed).sort((a,b)=>b.overall-a.overall);
              const hBestFW=hRoster.find(p=>p.position==="Forward"||p.position==="FW");

              const aBestFW=aRoster.find(p=>p.position==="Forward"||p.position==="FW");
              const hBestDF=hRoster.find(p=>p.position==="Defender"||p.position==="DF"||p.position==="DEF");
              const hBestMF=hRoster.find(p=>p.position==="Midfielder"||p.position==="MF");
              const aBestMF=aRoster.find(p=>p.position==="Midfielder"||p.position==="MF");
              const matchup=(pA,pB)=>{
                if(!pA||!pB)return null;
                const aWin=pA.overall>pB.overall;
                return <div style={{display:"flex",alignItems:"center",gap:8,padding:"10px 12px",background:T.card,borderRadius:0,border:`1px solid ${T.borderLt}`}}>
                  <div style={{flex:1,textAlign:"right"}}><div style={{fontFamily:T.serif,fontWeight:600,fontSize:12,color:aWin?T.ink:T.textDim}}>{pA.name.split(" ").slice(-1)[0]}</div><div style={{fontSize:10,color:T.textMute}}>{pA.position}</div></div>
                  <div style={{display:"flex",alignItems:"center",gap:4}}><span style={{fontFamily:T.serif,fontWeight:700,fontSize:16,color:gc(pA.overall)}}>{Math.round(pA.overall)}</span><span style={{fontSize:11,color:T.textMute}}>vs</span><span style={{fontFamily:T.serif,fontWeight:700,fontSize:16,color:gc(pB.overall)}}>{Math.round(pB.overall)}</span></div>
                  <div style={{flex:1}}><div style={{fontFamily:T.serif,fontWeight:600,fontSize:12,color:!aWin?T.ink:T.textDim}}>{pB.name.split(" ").slice(-1)[0]}</div><div style={{fontSize:10,color:T.textMute}}>{pB.position}</div></div>

                <div className="resp-h2h" style={{display:"grid",gridTemplateColumns:"1fr auto 1fr",gap:16,marginBottom:20,alignItems:"center"}}>
                  <div style={{textAlign:"center",padding:"16px",background:T.card,borderRadius:0,border:`1px solid ${T.borderLt}`}}>
                    <TeamBadge abbr={tH.abbr} size={48} logo={teamLogos[tH.abbr]}/>

                    <Badge grade={tH.overall} size="md"/>
                  </div>
                  <div style={{textAlign:"center"}}>
                    <div style={{fontFamily:T.display,fontWeight:900,fontSize:28,color:T.textMute}}>VS</div>

                  </div>
                  <div style={{textAlign:"center",padding:"16px",background:T.card,borderRadius:0,border:`1px solid ${T.borderLt}`}}>
                    <TeamBadge abbr={tA.abbr} size={48} logo={teamLogos[tA.abbr]}/>
                    <div style={{fontFamily:T.display,fontWeight:700,fontSize:18,color:T.ink,marginTop:8}}>{tA.name}</div>
                    <Badge grade={tA.overall} size="md"/>
                  </div>
                </div>
                <div style={{marginBottom:20}}>{cats.map(c=>{const hv=tH[c.k],av=tA[c.k];return <div key={c.k} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                  <span style={{fontFamily:T.mono,fontWeight:700,fontSize:13,color:gc(hv),width:28,textAlign:"right"}}>{hv}</span>
                  <div style={{flex:1,display:"flex",height:10,borderRadius:0,overflow:"hidden",background:T.borderLt}}>
                    <div style={{width:`${(hv/(hv+av))*100}%`,background:hv>=av?T.green:T.red,opacity:.6,borderRadius:"4px 0 0 4px"}}/>
                    <div style={{width:`${(av/(hv+av))*100}%`,background:av>hv?T.green:T.red,opacity:.6,borderRadius:"0 4px 4px 0"}}/>
                  </div>
                  <span style={{fontFamily:T.mono,fontWeight:700,fontSize:13,color:gc(av),width:28}}>{av}</span>
                  <span style={{fontSize:11,color:T.textMute,fontFamily:T.sans,width:56}}>{c.l}</span>
                </div>;})}</div>
                <div style={{fontSize:10,color:T.textMute,fontWeight:600,letterSpacing:1,fontFamily:T.sans,marginBottom:10}}>KEY PLAYER BATTLES</div>
                <div className="resp-grid3" style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>{matchup(hBestFW,aBestDF)}{matchup(hBestMF,aBestMF)}{matchup(hBestDF,aBestFW)}</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginTop:16}}>
                  {[{l:"Total Goals",h:tH.totalGoals,a:tA.totalGoals},{l:"Total Assists",h:tH.totalAssists,a:tA.totalAssists},{l:"Squad Value",h:fv(tH.squadValue),a:fv(tA.squadValue)},{l:"Avg Age",h:tH.avgAge||"—",a:tA.avgAge||"—"}].map(s=>(
                    <div key={s.l} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",background:T.card,borderRadius:0}}>
                      <span style={{fontFamily:T.mono,fontWeight:700,fontSize:13,color:T.ink}}>{s.h}</span>
                      <span style={{fontSize:11,color:T.textMute,fontFamily:T.sans,fontWeight:600}}>{s.l}</span>
                      <span style={{fontFamily:T.mono,fontWeight:700,fontSize:13,color:T.ink}}>{s.a}</span>
                    </div>
                  ))}
                </div>
              </div>;
            })()}
            {h2hHome&&h2hAway&&h2hHome===h2hAway&&<div style={{padding:20,textAlign:"center",color:T.textDim,fontFamily:T.serif,fontStyle:"italic"}}>Pick two different teams</div>}
            {(!h2hHome||!h2hAway)&&<div style={{padding:20,textAlign:"center",color:T.textDim,fontFamily:T.serif,fontStyle:"italic"}}>Select both teams above to see the matchup breakdown</div>}
          </div>
        </div>}

        {/* ═══ POWER RANKINGS ═══════════════════════════════════════════════ */}
        {!loading&&tab==="rankings"&&(()=>{
          const stMap={};standingsData.forEach(s=>{stMap[s.team]=s;});
          const ranked=enrichedTeams.filter(t=>t.count>0&&(confFilter==="All"||t.conf===confFilter)).map(t=>{
            const st=stMap[t.abbr]||{};
            return{...t,pts:st.pts||0,w:st.w||0,dr:st.d||0,l:st.l||0,gf:st.gf||0,ga:st.ga||0,gd:(st.gf||0)-(st.ga||0)};
          }).sort((a,b)=>{
            const dir=sortDir==="asc"?1:-1;
            if(["overall","attack","passing","defense","totalGoals","totalAssists"].includes(sortKey))return dir*(Number(a[sortKey]||0)-Number(b[sortKey]||0));
            if(b.pts!==a.pts)return b.pts-a.pts;if(b.gd!==a.gd)return b.gd-a.gd;return b.gf-a.gf;
          }).map((t,i)=>({...t,rank:i+1}));
          return <div style={{animation:"fadeUp .4s ease"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginBottom:16,flexWrap:"wrap",gap:10}}>
            <div>
              <div style={{fontFamily:T.display,fontWeight:700,fontSize:26,color:T.ink,letterSpacing:-.5}}>MLS Table</div>
              <div style={{fontSize:12,color:T.textMute,fontFamily:T.sans,marginTop:4}}>Official MLS standings with composite team grades. Points-based ranking with goal difference and grade overlays.</div>
            </div>
            <div style={{display:"flex",gap:8}}>
              <Select label="Conference" value={confFilter} onChange={setConfFilter} width={130} options={["All","Eastern","Western"]}/>
              <Select label="Sort" value={sortKey} onChange={v=>{setSortKey(v);setSortDir("desc");}} width={140} options={[["pts","By Points"],["overall","By OVR"],["attack","By ATT"],["passing","By PAS"],["defense","By DEF"],["totalGoals","By Goals"],["totalAssists","By Assists"]]}/>
            </div>
          </div>

          {/* Recent Results */}
          {matchesData.length>0&&(()=>{
            const completed=[...matchesData].filter(m=>m.completed).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
            if(!completed.length)return null;
            return <div style={{marginBottom:20,background:T.surface,border:`1px solid ${T.border}`,borderRadius:0,padding:"16px 20px"}}>
              <div style={{fontSize:11.5,color:T.textMute,fontWeight:600,letterSpacing:1.5,fontFamily:T.sans,textTransform:"uppercase",marginBottom:12}}>Recent Results</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:8}}>
                {completed.slice(0,16).map((m,i)=>{
                  const hs=+(m.homeScore||0),as=+(m.awayScore||0);
                  const dt=m.date?new Date(m.date):null;
                  const dateStr=dt?fmtET(dt):"";
                  return <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"10px 12px",background:T.card,borderRadius:0,border:`1px solid ${T.borderLt}`}}>
                    <div style={{flex:1,textAlign:"right",display:"flex",alignItems:"center",justifyContent:"flex-end",gap:6}}>
                      <span style={{fontFamily:T.sans,fontWeight:hs>as?700:500,fontSize:12,color:hs>as?T.ink:T.textDim}}>{m.home}</span>
                      <TeamBadge abbr={m.home} size={20} logo={teamLogos[m.home]}/>
                    </div>
                    <div style={{fontFamily:T.mono,fontWeight:700,fontSize:14,color:T.ink,minWidth:36,textAlign:"center"}}>{hs}–{as}</div>
                    <div style={{flex:1,display:"flex",alignItems:"center",gap:6}}>
                      <TeamBadge abbr={m.away} size={20} logo={teamLogos[m.away]}/>
                      <span style={{fontFamily:T.sans,fontWeight:as>hs?700:500,fontSize:12,color:as>hs?T.ink:T.textDim}}>{m.away}</span>
                    </div>
                    <span style={{fontSize:10,color:T.textMute,fontFamily:T.sans,minWidth:40,textAlign:"right"}}>{dateStr}</span>
                  </div>;
                })}
              </div>
            </div>;
          })()}
          {/* Power Rankings — composite algorithm */}
          {enrichedTeams.length>0&&(()=>{
            const stMap={};standingsData.forEach(s=>{stMap[s.team]=s;});
            // Power score: 50% normalized points + 30% team OVR + 20% recent form
            const maxPts=Math.max(...ranked.map(t=>t.pts),1);
            const powerRanked=ranked.map(t=>{
              const normPts=(t.pts/maxPts)*100;
              const normGrade=t.overall||50;
              // Recent form from matchesData
              const teamMatches=[...matchesData].filter(m=>m.completed&&(m.home===t.abbr||m.away===t.abbr)).sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,5);
              let formPts=0;
              teamMatches.forEach(m=>{
                const hs=+(m.homeScore||0),as=+(m.awayScore||0);
                const isHome=m.home===t.abbr;
                const won=isHome?(hs>as):(as>hs);
                const drew=hs===as;
                formPts+=won?3:drew?1:0;
              });
              const formScore=teamMatches.length>0?(formPts/(teamMatches.length*3))*100:50;
              const power=Math.round(normPts*.50+normGrade*.30+formScore*.20);
              // Movement arrow: compare power rank to pure points rank
              return{...t,power,formScore:Math.round(formScore),recentRecord:teamMatches.length};
            }).sort((a,b)=>b.power-a.power).map((t,i)=>({...t,powerRank:i+1}));
            // Points-table rank computed independently of the user's current sort
            const ptsOrder=[...standingsData].sort((a,b)=>(b.pts||0)-(a.pts||0)||((b.gf||0)-(b.ga||0))-((a.gf||0)-(a.ga||0))||(b.gf||0)-(a.gf||0)).map(s=>s.team);
            // Real week-over-week movement only when a genuine prior snapshot exists
            const snapWk=pickWeekAgo(rankHistory,cacheMeta&&cacheMeta.generated);
            powerRanked.forEach(t=>{
              const ptsRank=ptsOrder.indexOf(t.abbr)+1;
              t.vsTable=ptsRank>0?ptsRank-t.powerRank:0; // positive = ranked higher than the points table
              const prev=snapWk&&snapWk.power&&snapWk.power[t.abbr];
              t.movement=Number.isFinite(prev)?prev-t.powerRank:null; // null = no real history yet
            });
            const moveLabel=snapWk?("Arrows: movement since "+fmtET(snapWk.date)):"Arrows: vs points table (week-over-week appears once ranking history accrues)";
            return <div style={{marginBottom:20,background:T.surface,border:`1px solid ${T.border}`,borderRadius:0,overflow:"hidden"}}>
              <div style={{padding:"14px 18px",borderBottom:`1px solid ${T.borderLt}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <div style={{fontFamily:T.display,fontWeight:700,fontSize:18,color:T.ink}}>Power Rankings</div>
                  <div style={{fontSize:11,color:T.textMute,fontFamily:T.sans}}>Composite score: 50% points + 30% team grade + 20% recent form \u00b7 {moveLabel}</div>
                </div>
                <CardButton label="Share card" onClick={()=>cardPowerRankings({rows:powerRanked,moveLabel:snapWk?"movement since "+fmtET(snapWk.date):"arrows vs points table",logos:teamLogos})}/>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:0}}>
                {powerRanked.slice(0,12).map((t,i)=>(
                  <div key={t.abbr} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 16px",borderBottom:`1px solid ${T.borderLt}`,borderRight:`1px solid ${T.borderLt}`,background:i<3?T.card:"transparent"}}>
                    <span style={{fontFamily:T.display,fontWeight:900,fontSize:i<3?22:16,color:i<3?T.gold:i<6?T.green:T.textDim,width:24,textAlign:"center"}}>{t.powerRank}</span>
                    {(()=>{const mv=t.movement!=null?t.movement:t.vsTable;const ttl=t.movement!=null?"Change since last snapshot":"Power rank vs points-table rank";return <span title={ttl} style={{fontSize:12,width:24,textAlign:"center",fontFamily:T.mono,fontWeight:700,color:mv>0?T.green:mv<0?T.red:T.textMute}}>{mv>0?`↑${mv}`:mv<0?`↓${Math.abs(mv)}`:"—"}</span>;})()}
                    <TeamBadge abbr={t.abbr} size={26} logo={teamLogos[t.abbr]}/>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontFamily:T.serif,fontWeight:700,fontSize:13,color:T.ink,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{t.name}</div>
                      <div style={{fontSize:10,color:T.textDim,fontFamily:T.sans}}>{t.w}-{t.dr}-{t.l} · {t.pts} pts</div>
                    </div>
                    <div style={{textAlign:"right"}}>
                      <div style={{fontFamily:T.serif,fontWeight:700,fontSize:16,color:gc(t.power)}}>{t.power}</div>
                      <div style={{fontSize:10,color:T.textMute,fontFamily:T.sans}}>PWR</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>;
          })()}

          <div style={{borderRadius:0,border:`1px solid ${T.border}`,overflow:"hidden",background:T.surface}}>

            });
            const teams=Object.values(teamData);
            if(!teams.length||!teams[0].remaining)return null;
            // Simple simulation: for each remaining game, win=40%, draw=30%, loss=30% weighted by current form
            const results={};
            teams.forEach(t=>{results[t.abbr]={playoff:0,shield:0,totalPts:0};});
            for(let s=0;s<sims;s++){

                const winRate=Math.min(0.65,0.2+(t.pts/(t.played||1)*3)/100);
                let pts=t.pts;
                for(let g=0;g<t.remaining;g++){
                  const r=Math.random();
                  if(r<winRate)pts+=3;
                  else if(r<winRate+0.28)pts+=1;
                }
                simPts[t.abbr]=pts;
              });
              // Top 9 per conference make playoffs
              const east=teams.filter(t=>t.conf==="Eastern").map(t=>({...t,simPts:simPts[t.abbr]})).sort((a,b)=>b.simPts-a.simPts);

            }

                        <div style={{fontSize:11,color:T.textMute,fontFamily:T.mono,width:32,textAlign:"right"}}>{t.projPts}pt</div>
